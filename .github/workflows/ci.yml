name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 22
          - 24
    services:
      memcached:
        image: memcached:alpine
        ports:
          - 11211:11211
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Start memcached with authentication
        run: |
          chmod 644 test/fixtures/authfile
          docker run -d --rm --name plt-memcached-auth-test -p 11214:11211 -v "$PWD/test/fixtures:/auth:ro" memcached:alpine memcached -Y /auth/authfile
      - name: Test
        run: npm test
