name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 22
          - 24
    services:
      memcached:
        image: memcached:alpine
        ports:
          - 11211:11211
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build
      - name: Typecheck
        run: pnpm run typecheck
      - name: Start memcached with authentication
        run: |
          chmod 644 packages/memcached/test/fixtures/authfile
          docker run -d --rm --name plt-memcached-auth-test -p 11214:11211 -v "$PWD/packages/memcached/test/fixtures:/auth:ro" memcached:alpine memcached -Y /auth/authfile
      - name: Test
        run: pnpm test
